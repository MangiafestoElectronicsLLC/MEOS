name: Deploy Kodi install page

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zips/**"
      - "zips-k18/**"
      - "addons.xml"
      - "addons.xml.md5"
      - "addons-k18.xml"
      - "addons-k18.xml.md5"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Assemble site (install page + addon feed)
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp addons.xml addons.xml.md5 addons-k18.xml addons-k18.xml.md5 _site/
          cp -r zips _site/zips
          cp -r zips-k18 _site/zips-k18
          ls -R _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4